<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>댓글 분석 테스트 (3,4,5단계)</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <h1 class="title">💬 댓글 분석 테스트</h1>
            <p class="subtitle">3단계: 댓글 필터링 → 4단계: 키워드 추출 → 5단계: 좌우파 판별</p>
        </header>

        <!-- 테스트 데이터 입력 -->
        <section class="input-section">
            <div class="card">
                <h2>📝 테스트 데이터 입력</h2>
                
                <!-- 영상 키워드 입력 -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 10px;">
                        🔑 영상 키워드 (콤마로 구분)
                    </label>
                    <input 
                        type="text" 
                        id="videoKeywords" 
                        class="input-field" 
                        placeholder="예: 정부, 정책, 대통령, 여당, 야당"
                        value="정부, 정책, 대통령, 여당, 야당, 국회"
                    >
                </div>

                <!-- 댓글 데이터 입력 -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 600; margin-bottom: 10px;">
                        💬 댓글 데이터 (한 줄에 하나씩)
                    </label>
                    <textarea 
                        id="commentsInput" 
                        style="width: 100%; min-height: 300px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; font-family: inherit;"
                        placeholder="한 줄에 댓글 하나씩 입력하세요..."
                    >정부의 정책이 잘못됐다고 봅니다. 서민을 위한 복지 확대가 시급합니다.
야당은 반대만 하지 말고 대안을 제시해야 합니다.
자유시장 경제가 답입니다. 정부 개입은 최소화해야 합니다.
대통령의 리더십이 훌륭합니다. 국가 발전을 위해 힘써주시는 모습이 감동적입니다.
부자 증세가 필요합니다. 소득 재분배를 통해 양극화를 해소해야 합니다.
규제 완화로 기업이 숨통을 틔워줘야 경제가 살아납니다.
이 정책은 서민을 위한 것이 아니라 특권층만 배불리는 정책입니다.
전통적 가치를 지키는 것이 중요합니다. 급진적 변화는 위험합니다.
여성, LGBT, 소수자 인권 보호가 우선되어야 합니다.
국가 안보가 최우선입니다. 국방비 증액이 필요합니다.
친환경 정책을 강화해야 합니다. 탄소중립 실현이 시급합니다.
정부 지출을 줄이고 작은 정부를 지향해야 합니다.
노동자 권리 보호와 최저임금 인상이 필요합니다.
이런 영상 올려주셔서 감사합니다.
오늘 날씨 좋네요.
좋아요 꾹!
진보 정권 들어서면서 나라가 엉망이 됐습니다.
보수 정권의 적폐를 청산해야 합니다.
복지 포퓰리즘은 국가 재정을 망칩니다.
무상 의료, 무상 교육이 시급합니다.</textarea>
                </div>

                <button id="analyzeBtn" class="btn btn-primary" style="width: 100%;">
                    <span class="btn-text">댓글 분석 시작 (3~5단계)</span>
                    <span class="spinner" style="display: none;">⏳</span>
                </button>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </div>
        </section>

        <!-- 3단계: 필터링된 댓글 -->
        <section id="step3Section" class="result-section" style="display: none;">
            <div class="card">
                <h2>✅ 3단계: 키워드 관련 댓글 필터링</h2>
                <div id="step3Stats" class="stats-container"></div>
                <div id="step3Comments" class="comments-list"></div>
            </div>
        </section>

        <!-- 4단계: 키워드 추출 -->
        <section id="step4Section" class="result-section" style="display: none;">
            <div class="card">
                <h2>✅ 4단계: 댓글별 키워드 추출</h2>
                <div id="step4Comments" class="comments-list"></div>
            </div>
        </section>

        <!-- 5단계: 좌우파 판별 -->
        <section id="step5Section" class="result-section" style="display: none;">
            <div class="card">
                <h2>✅ 5단계: 좌파/우파 성향 판별</h2>
                <div id="step5Chart" class="chart-container"></div>
                <div id="step5Comments" class="comments-list"></div>
            </div>
        </section>

        <!-- 푸터 -->
        <footer class="footer">
            <p>© 2025 색깔전쟁 | 댓글 분석 테스트 페이지 (3,4,5단계 전용)</p>
        </footer>
    </div>

    <script src="/static/js/test_comments.js"></script>
</body>
</html>
